services:
  catalogue-service:
    build: ./services/catalogue-service
    environment:
      PORT: "3000"
      SERVICE_NAME: catalogue-service
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

