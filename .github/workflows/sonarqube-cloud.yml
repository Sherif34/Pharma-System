name: SonarQube Cloud analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and analyze Catalogue prototype
        working-directory: services/catalogue-service/java-tests
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn --batch-mode clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.projectKey=Sherif34_Pharma-System
          -Dsonar.organization=sherif34
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
