name: Service Java tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalogue, inventory, purchasing, stock-review]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run tests and generate coverage
        run: mvn --batch-mode --file services/${{ matrix.service }}-service/java-tests/pom.xml verify
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}-service/java-tests/target/surefire-reports/
            services/${{ matrix.service }}-service/java-tests/target/site/jacoco/
          if-no-files-found: warn
