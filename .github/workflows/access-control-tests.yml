name: Access Control Tests

on:
  push:
    branches:
      - rober/us17-devops
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Get the code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests and generate coverage
        working-directory: services/access-control-service/access-control-java
        run: mvn --batch-mode verify

      - name: Save coverage report
        uses: actions/upload-artifact@v6
        with:
          name: access-control-coverage
          path: services/access-control-service/access-control-java/target/site/jacoco/

      - name: Authenticate with SonarQube Cloud
        uses: SonarSource/sonarqube-auth-action@v1
        id: sonar-auth

      - name: Analyze code and check quality gate
        working-directory: services/access-control-service/access-control-java
        run: >
          mvn --batch-mode org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=${{ steps.sonar-auth.outputs.organization }}
          -Dsonar.projectKey=${{ steps.sonar-auth.outputs.project-key }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
